<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>目黒区 災害情報共有システム</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header id="header">
    <h1>目黒区 災害情報共有システム</h1>
    <span id="demo-badge" hidden title="GeonicDBのAPIキーが未設定のため、メモリ上のサンプルデータで動作しています">デモモード（サンプルデータ）</span>
    <div id="mode-switch" role="group" aria-label="利用モード">
      <button type="button" data-mode="hq" class="active">災害対策本部</button>
      <button type="button" data-mode="shelter">参集指定職員</button>
      <button type="button" data-mode="field">現場職員</button>
      <button type="button" data-mode="logistics">物資管理</button>
    </div>
    <button type="button" id="elapsed" title="クリックで発災時刻を設定">発災時刻 未設定</button>
    <a id="incidents-link" href="/incidents/" target="_blank" rel="noopener" title="災害ごとの画面を別タブで開く">災害一覧</a>
    <div id="clock"></div>
  </header>

  <aside id="sidebar-left">
    <section class="card">
      <h2>被害状況</h2>
      <div id="summary" class="summary">集計中...</div>
    </section>

    <section class="card" id="card-broadcast">
      <h2>情報発信</h2>
      <button type="button" class="button primary" id="broadcast-button">区民へ情報を発信する</button>
      <div id="broadcast-log"></div>
    </section>

    <section class="card" id="card-lifeline">
      <h2>ライフライン（丁目別）</h2>
      <p class="lifeline-readonly-note">閲覧のみ。入力は災害対策本部の画面から行います。</p>
      <div id="lifeline-buttons"></div>
      <div id="lifeline-legend" hidden></div>
    </section>

    <section class="card">
      <h2>表示レイヤー</h2>
      <div id="layers"></div>
    </section>

    <section class="card" id="card-report">
      <h2>帳票</h2>
      <table id="category-table"><tbody></tbody></table>
      <a class="button primary" href="/report/" target="_blank" rel="noopener">本部会議用レポートを開く</a>
      <a id="csv-link" class="button" href="/api/summary.csv">被害一覧をCSV出力</a>
    </section>
  </aside>

  <div id="map-wrap">
    <main id="map"></main>
    <div id="incident-banner" hidden></div>
  </div>

  <section id="logistics" hidden>
    <div class="logistics-col">
      <h2>避難所</h2>
      <p class="logistics-hint">物資要求がある避難所を選んでください</p>
      <div id="shelter-queue"></div>
    </div>

    <div class="logistics-col">
      <h2>この避難所への割当</h2>
      <div id="allocation-panel"></div>
    </div>

    <div class="logistics-col">
      <h2>割当・配送状況</h2>
      <div id="allocation-list"></div>
      <h2>倉庫別の在庫</h2>
      <select id="inventory-select" aria-label="在庫を表示する備蓄倉庫"></select>
      <div id="inventory-table"></div>
      <h2>区内の備蓄総数</h2>
      <div id="inventory-total"></div>
    </div>
  </section>

  <aside id="sidebar-right">
    <section class="card fill">
      <h2>時系列（ホワイトボード）</h2>
      <form id="notice-form">
        <div class="notice-row">
          <select name="category" aria-label="共有事項の区分"></select>
          <button type="submit" class="button primary">登録</button>
        </div>
        <div class="notice-row">
          <input type="datetime-local" name="postedAt" aria-label="発生・共有時刻" />
          <button type="button" class="button" data-action="now">現在時刻</button>
        </div>
        <input name="body" placeholder="例: 災害対策本部を設置" aria-label="共有事項の内容" />
      </form>
      <div id="timeline-filter"></div>
      <ol id="timeline"></ol>
    </section>
  </aside>

  <div id="mode-hint" hidden></div>

  <dialog id="dialog">
    <form id="dialog-form" method="dialog"></form>
  </dialog>

  <dialog id="list-dialog">
    <div id="list-body"></div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
